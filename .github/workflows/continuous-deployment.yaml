name: Continuous Deployment

on:
    push:
        branches:
            - main
            - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout default branch
              uses: actions/checkout@v6

            - name: Use pnpm
              uses: pnpm/action-setup@v5
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install npm dependencies
              run: pnpm i --frozen-lockfile

            - name: Build the packages
              run: pnpm build

            - name: Cache the built artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: built-artifacts
                  path: packages/*/dist
                  if-no-files-found: error

    lint:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout default branch
              uses: actions/checkout@v6

            - name: Use pnpm
              uses: pnpm/action-setup@v5
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install npm dependencies
              run: pnpm i --frozen-lockfile

            - name: Download built artifacts
              uses: actions/download-artifact@v8
              with:
                  name: built-artifacts
                  path: packages

            - name: Add app-bridge dependency for guideline-blocks-settings
              run: pnpm add @frontify/app-bridge@workspace:^ --filter {packages/guideline-blocks-settings}

            - name: Lint code
              run: pnpm lint

    typecheck:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout default branch
              uses: actions/checkout@v6

            - name: Use pnpm
              uses: pnpm/action-setup@v5
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install npm dependencies
              run: pnpm i --frozen-lockfile

            - name: Download built artifacts
              uses: actions/download-artifact@v8
              with:
                  name: built-artifacts
                  path: packages

            - name: Add app-bridge dependency for guideline-blocks-settings
              run: pnpm add @frontify/app-bridge@workspace:^ --filter {packages/guideline-blocks-settings}

            - name: Typecheck code
              run: pnpm typecheck

    unit-tests:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            id-token: write
            contents: write
            pull-requests: write

        steps:
            - name: Checkout default branch
              uses: actions/checkout@v6

            - name: Use pnpm
              uses: pnpm/action-setup@v5
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install npm dependencies
              run: pnpm i --frozen-lockfile

            - name: Download built artifacts
              uses: actions/download-artifact@v8
              with:
                  name: built-artifacts
                  path: packages

            - name: Add app-bridge dependency for guideline-blocks-settings
              run: pnpm add @frontify/app-bridge@workspace:^ --filter {packages/guideline-blocks-settings}

            - name: Test code
              run: pnpm test

    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        needs: [lint, typecheck, unit-tests]

        permissions:
            contents: write # to create release (changesets/action)
            pull-requests: write # to create pull request (changesets/action)
            id-token: write # to authenticate with npm registry via OIDC

        steps:
            - name: Generate GitHub App token
              id: generate-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.FRONTIFY_RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.FRONTIFY_RELEASE_APP_PRIVATE_KEY }}
                  repositories: brand-sdk
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout default branch
              uses: actions/checkout@v6
              with:
                  token: ${{ steps.generate-token.outputs.token }}

            - name: Use pnpm
              uses: pnpm/action-setup@v5
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: "pnpm"

            - name: Install npm dependencies
              run: pnpm i --frozen-lockfile

            - name: Create release PR or publish to npm
              id: changesets
              uses: changesets/action@v2
              with:
                  github-token: ${{ steps.generate-token.outputs.token }}
                  commit-message: "chore: release packages"
                  pr-title: "chore: release packages"
                  create-github-releases: true
                  publish-script: pnpm release
              env:
                  NPM_CONFIG_PROVENANCE: true
